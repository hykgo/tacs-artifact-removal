[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tacs-artifact-removal"
version = "0.1.0"
description = "Sliding-window sinusoidal artifact cancellation for EEG and SEEG recordings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
edf = ["mne>=1.5"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
tacs-artifact-removal = "tacs_artifact_removal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
